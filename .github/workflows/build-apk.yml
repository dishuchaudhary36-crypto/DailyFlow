name: Build DayFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project
        run: |
          unzip -q DayFlow_Android_Project.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/DayFlowAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-APK
          path: extracted/DayFlowAndroid/app/build/outputs/apk/debug/app-debug.apk
